name: Runtime logs

on:
  workflow_dispatch:
    inputs:
      needle:
        description: Exact delivery id, head SHA, or trace id
        required: true
        type: string

permissions:
  contents: read

jobs:
  capture:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v7.0.1
      - name: Query retained runtime logs
        env:
          CLOUDFLARE_ACCOUNT_ID: ${{ vars.CLOUDFLARE_ACCOUNT_ID }}
          CLOUDFLARE_API_TOKEN: ${{ secrets.CLOUDFLARE_API_TOKEN }}
        run: scripts/query-observability.sh "${{ inputs.needle }}"
